[project]
name = "stellar-gateway"
version = "0.1.0"
description = ""
authors = [
    {name = "Guilherme Silveira Coutinho",email = "guisilveira.cout@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.14.14,<0.15.0)",
    "pre-commit (>=4.5.1,<5.0.0)",
    "mypy (>=1.19.1,<2.0.0)"
]

[tool.poetry]
package-mode= false

[tool.pytest.ini_options]
pythonpath = "src"
testpaths = ["tests"]
addopts = "-v --cov=src"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort (imports organizados)
    "B",  # flake8-bugbear (bugs comuns)
]
ignore = []

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true