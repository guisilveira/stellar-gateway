# =============================================================================
# OpenAPI Template for GCP API Gateway
# =============================================================================
# This is a TEMPLATE file. Generate the actual openapi.yaml using envsubst:
#
#   export GCP_PROJECT_ID="your-project-id"
#   export CLOUD_RUN_URL="https://your-service-xxxxx.us-central1.run.app"
#   envsubst < openapi.template.yaml > openapi.yaml
#
# Required environment variables:
#   - GCP_PROJECT_ID: Your Google Cloud Project ID
#   - CLOUD_RUN_URL: The Cloud Run service URL (full URL with https://)
# =============================================================================

swagger: "2.0"
info:
  title: Stellar Gateway API
  description: |
    A serverless proxy for the Star Wars API (SWAPI) with authentication,
    caching, and data enrichment.
  version: "1.0.0"

host: stellar-gateway-api.endpoints.${GCP_PROJECT_ID}.cloud.goog
basePath: /

schemes:
  - https

produces:
  - application/json

# Security definitions
securityDefinitions:
  firebase:
    authorizationUrl: ""
    flow: implicit
    type: oauth2
    x-google-issuer: "https://securetoken.google.com/${GCP_PROJECT_ID}"
    x-google-jwks_uri: "https://www.googleapis.com/service_accounts/v1/metadata/x509/securetoken@system.gserviceaccount.com"
    x-google-audiences: "${GCP_PROJECT_ID}"

# Default backend for all routes
x-google-backend:
  address: ${CLOUD_RUN_URL}
  deadline: 60.0

paths:
  /health:
    get:
      operationId: healthCheck
      summary: Health check endpoint
      description: Returns the health status of the API. No authentication required.
      responses:
        200:
          description: API is healthy
          schema:
            type: object
            properties:
              status:
                type: string
                example: healthy

  /me:
    get:
      operationId: getCurrentUser
      summary: Get current user info
      description: Returns the authenticated user's information from the Firebase token.
      security:
        - firebase: []
      responses:
        200:
          description: User information
          schema:
            type: object
            properties:
              uid:
                type: string
                description: Firebase user ID
              email:
                type: string
                description: User's email address
              name:
                type: string
                description: User's display name
              email_verified:
                type: boolean
                description: Whether the email has been verified
        401:
          description: Missing or invalid authentication

  /people:
    get:
      operationId: listPeople
      summary: List all people
      description: Returns a paginated list of Star Wars characters.
      security:
        - firebase: []
      parameters:
        - name: page
          in: query
          type: integer
          minimum: 1
          description: Page number for pagination
        - name: search
          in: query
          type: string
          description: Search query to filter results
        - name: sort_by
          in: query
          type: string
          description: Field to sort by (e.g., name, height, mass)
        - name: sort_order
          in: query
          type: string
          enum: [asc, desc]
          default: asc
          description: Sort order (ascending or descending)
      responses:
        200:
          description: Paginated list of people
        401:
          description: Missing or invalid authentication

  /people/{id}:
    get:
      operationId: getPerson
      summary: Get a specific person
      description: Returns details of a specific Star Wars character.
      security:
        - firebase: []
      parameters:
        - name: id
          in: path
          type: integer
          required: true
          description: The person's unique identifier
        - name: enrich
          in: query
          type: boolean
          default: true
          description: Whether to enrich URLs with resource names
      responses:
        200:
          description: Person details
        401:
          description: Missing or invalid authentication
        404:
          description: Person not found

  /planets:
    get:
      operationId: listPlanets
      summary: List all planets
      description: Returns a paginated list of Star Wars planets.
      security:
